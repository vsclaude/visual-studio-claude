<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  The app's mark: the VS lettermark, white on a violet-to-amber plate. The one
  source for every logo the app ships — `make icon` (scripts/app-icon.mjs)
  renders the packaged icon from it, the renderer serves it as the favicon
  (src/renderer/public/favicon.svg is a copy), and docs/banner.svg and
  vsclaude-cloud's pages inline it.

  The letters are resources/vs-mark.svg, path for path, nested at its own
  measured box so the glyph's ink — not its slant — is what sits centred. It
  replaced code brackets around a spark: the name is now written with this
  glyph, and an icon saying something else beside it was two brands.
  The plate is the credits' violet-to-amber (`CreditsBadge`), stopped five
  times and deepened at the violet end: two stops in sRGB go grey in the
  middle, which a badge gets away with and a Dock icon does not.
-->
<defs>
  <linearGradient id="vsc-plate" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6D28D9"/>
    <stop offset="0.25" stop-color="#8B5CF6"/>
    <stop offset="0.5" stop-color="#C76BC4"/>
    <stop offset="0.75" stop-color="#F0956A"/>
    <stop offset="1" stop-color="#FCC63A"/>
  </linearGradient>
  <linearGradient id="vsc-sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="100" height="100" rx="22.5" fill="url(#vsc-plate)"/>
<rect width="100" height="100" rx="22.5" fill="url(#vsc-sheen)"/>
<svg x="21" y="23" width="58" height="54" viewBox="8.85 -0.05 64.5 60.1">
  <g transform="skewX(-12) translate(10 0)" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="5,5 20,55 35,5"/>
    <path d="M61 13C57 6 49 4.5 44 6C36 8.5 36 19 43 24C48 27.5 56 30 60 35C66 43 60 55 49 55C43 55 38 52.5 35 47"/>
  </g>
</svg>
</svg>

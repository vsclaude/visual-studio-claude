<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  The app's mark: code brackets around a spark, white on a violet-to-amber
  plate. The one source for every logo the app ships — `make icon`
  (scripts/app-icon.mjs) renders the packaged icon from it, the renderer serves
  it as the favicon (src/renderer/public/favicon.svg is a copy), and
  docs/banner.svg and vsclaude-cloud's pages inline it.

  The spark is this app's own four-point star. The mark used to hold Claude's
  own logo between the brackets, which was Anthropic's to use and not ours.
  The plate is the credits' violet-to-amber (`CreditsBadge`), stopped five
  times and deepened at the violet end: two stops in sRGB go grey in the
  middle, which a badge gets away with and a Dock icon does not.
-->
<defs>
  <linearGradient id="vsc-plate" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6D28D9"/>
    <stop offset="0.25" stop-color="#8B5CF6"/>
    <stop offset="0.5" stop-color="#C76BC4"/>
    <stop offset="0.75" stop-color="#F0956A"/>
    <stop offset="1" stop-color="#FCC63A"/>
  </linearGradient>
  <linearGradient id="vsc-sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="100" height="100" rx="22.5" fill="url(#vsc-plate)"/>
<rect width="100" height="100" rx="22.5" fill="url(#vsc-sheen)"/>
<polyline points="31,31 16,50 31,69" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="69,31 84,50 69,69" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
<path fill="#FFFFFF" d="M50 35Q52.4 47.6 65 50Q52.4 52.4 50 65Q47.6 52.4 35 50Q47.6 47.6 50 35Z"/>
</svg>

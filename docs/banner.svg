<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Vey Studio — Claude Code and your editor, in one app</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0912"/>
      <stop offset="0.55" stop-color="#100E1F"/>
      <stop offset="1" stop-color="#0B0A16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFA" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#5B3FE8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5B3FE8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="640" cy="200" rx="420" ry="240" fill="url(#glow)"/>

  <!-- the mark: resources/logo.svg, inlined -->
  <rect x="572" y="84" width="136" height="136" rx="34" fill="#9B7BFF" fill-opacity="0.28" filter="url(#soft)"/>
  <svg x="568" y="80" width="144" height="144" viewBox="0 0 100 100" fill="none">
    <defs>
      <linearGradient id="vsc-plate" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6D28D9"/>
        <stop offset="0.25" stop-color="#8B5CF6"/>
        <stop offset="0.5" stop-color="#C76BC4"/>
        <stop offset="0.75" stop-color="#F0956A"/>
        <stop offset="1" stop-color="#FCC63A"/>
      </linearGradient>
      <linearGradient id="vsc-sheen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
        <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="22.5" fill="url(#vsc-plate)"/>
    <rect width="100" height="100" rx="22.5" fill="url(#vsc-sheen)"/>
    <svg x="21" y="23" width="58" height="54" viewBox="8.85 -0.05 64.5 60.1">
      <g transform="skewX(-12) translate(10 0)" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,5 20,55 35,5"/><path d="M61 13C57 6 49 4.5 44 6C36 8.5 36 19 43 24C48 27.5 56 30 60 35C66 43 60 55 49 55C43 55 38 52.5 35 47"/></g>
    </svg>
  </svg>

  <!-- the wordmark: resources/vs-mark.svg at the cap height, then "Vey Studio" -->
  <svg x="497.5" y="258.2" width="40.6" height="37.8" viewBox="8.85 -0.05 64.5 60.1" fill="none">
    <defs><linearGradient id="vs-ink" gradientUnits="userSpaceOnUse" x1="5" y1="5" x2="66" y2="55"><stop offset="0" stop-color="#A78BFA"/><stop offset="0.55" stop-color="#D88BD0"/><stop offset="1" stop-color="#FCC63A"/></linearGradient></defs>
    <g transform="skewX(-12) translate(10 0)" stroke="url(#vs-ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,5 20,55 35,5"/><path d="M61 13C57 6 49 4.5 44 6C36 8.5 36 19 43 24C48 27.5 56 30 60 35C66 43 60 55 49 55C43 55 38 52.5 35 47"/></g>
  </svg>
  <text x="547.8" y="296" font-size="44" font-weight="700" letter-spacing="1" fill="#FFFFFF">Vey Studio</text>
  <text x="640" y="336" text-anchor="middle" font-size="19" fill="#B6ABD8">Claude Code and your editor, in one app.</text>

    <g>
      <rect x="108" y="400" width="248" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="128" y="420" width="40" height="40" rx="10" fill="#D97757" fill-opacity="0.16"/>
      <g transform="translate(136,428)" fill="none" stroke="#D97757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5 a3 3 0 0 1 3 -3 h12 a3 3 0 0 1 3 3 v8 a3 3 0 0 1 -3 3 h-7 l-5 4 v-4 a3 3 0 0 1 -3 -3z"/></g>
      <text x="128" y="490" font-size="17" font-weight="600" fill="#F2EFFF">Chats</text>
      <text x="128" y="514" font-size="12.5" fill="#A99FCB">Many claude sessions, one per tab</text>
    </g>
    <g>
      <rect x="380" y="400" width="248" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="400" y="420" width="40" height="40" rx="10" fill="#1F9CF0" fill-opacity="0.16"/>
      <g transform="translate(408,428)" fill="none" stroke="#1F9CF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6 l-6 6 6 6 M16 6 l6 6 -6 6"/></g>
      <text x="400" y="490" font-size="17" font-weight="600" fill="#F2EFFF">Editor</text>
      <text x="400" y="514" font-size="12.5" fill="#A99FCB">Every file, 140+ languages</text>
    </g>
    <g>
      <rect x="652" y="400" width="248" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="672" y="420" width="40" height="40" rx="10" fill="#5FD08A" fill-opacity="0.16"/>
      <g transform="translate(680,428)" fill="none" stroke="#5FD08A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M2 12 h6 M16 12 h6"/></g>
      <text x="672" y="490" font-size="17" font-weight="600" fill="#F2EFFF">Diff &amp; Commit</text>
      <text x="672" y="514" font-size="12.5" fill="#A99FCB">Review, stage, AI-drafted message</text>
    </g>
    <g>
      <rect x="924" y="400" width="248" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect x="944" y="420" width="40" height="40" rx="10" fill="#B49BFF" fill-opacity="0.16"/>
      <g transform="translate(952,428)" fill="none" stroke="#B49BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7 l5 5 -5 5 M12 18 h8"/></g>
      <text x="944" y="490" font-size="17" font-weight="600" fill="#F2EFFF">Terminal</text>
      <text x="944" y="514" font-size="12.5" fill="#A99FCB">A shell docked under every pane</text>
    </g>
</svg>

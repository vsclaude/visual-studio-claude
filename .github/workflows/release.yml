name: Release

# Installers are built here and nowhere else, so a release is a tag and
# nothing more: `git tag v0.1.0 && git push --tags`. Running it by hand builds
# the same three installers and leaves them as run artifacts without publishing
# anything, which is how you find out a packaging change is broken before a tag
# carries it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the other two are fine —
      # the point of a release run is to learn that in one pass.
      fail-fast: false
      matrix:
        include:
          # macOS builds both architectures: `mac.target` in package.json
          # declares arm64 and x64, and install.sh picks between them by
          # filename. Deliberately not a universal build, which would double
          # every download so that nobody has to choose.
          - os: macos-latest
            name: macos
            target: --mac
          - os: ubuntu-latest
            name: linux
            target: --linux
          - os: windows-latest
            name: windows
            target: --win
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      # The version in package.json is what names every artifact. A tag that
      # disagrees with it would publish v0.2.0 containing Vey-Studio-0.1.0-arm64.dmg,
      # which is only ever noticed by whoever downloads it.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # Baked into main.cjs by scripts/build-electron.mjs, since the installed
      # app has no .env. A repository variable, not a secret: the URL is
      # readable in the bundle anyway. Unset, the free AI is hidden. The
      # variable under the app's old name is the fallback, so a repository
      # that has not renamed it still ships the free AI.
      - run: bun run build
        env:
          VEYSTUDIO_AI_URL: ${{ vars.VEYSTUDIO_AI_URL || vars.VSCLAUDE_AI_URL }}

      # Both are gitignored — the source art is committed and what is derived
      # from it is not — so a fresh checkout has neither until this runs.
      # electron-builder would otherwise fall back to a default icon and a
      # default DMG background without failing.
      - name: Generate icon and DMG background
        run: |
          bun scripts/app-icon.mjs
          bun scripts/dmg-background.mjs

      - name: Build installers
        # Unsigned on every platform: signing macOS needs an Apple Developer
        # membership and Windows a code-signing certificate, and neither is a
        # secret this repository holds. CSC_IDENTITY_AUTO_DISCOVERY is what
        # stops electron-builder failing on the macOS runner when it finds no
        # identity in the keychain. See README for what unsigned costs the
        # person installing it.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          # electron-builder writes blockmaps, a builder-debug.yml and the
          # unpacked tree next to the installers; only the installers are the
          # release.
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and its tags, for the notes' range below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      # The installers are published to a repository of their own, which is
      # where the app's updater and install.sh look. `github.token` can write
      # to this repository only, so the upload takes RELEASES_TOKEN: a
      # fine-grained token with Contents read/write on that one repository.
      # The notes are the commit subjects since the previous tag, written out
      # in the release itself. Not GitHub's generated notes: those are PR and
      # compare links into this repository, which a reader of the releases
      # repository cannot follow. A `(#12)` is dropped for the same reason —
      # over there it would link to that repository's own issue 12 — and so
      # is the version-bump commit, which says nothing the title does not.
      - name: Publish
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: veystudioapp/vey-studio-releases
        run: |
          ls -lh installers
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::secret RELEASES_TOKEN is not set"
            exit 1
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          git log --no-merges --format='%s' "$range" \
            | grep -Ev '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -E 's/ ?\(#[0-9]+\)//g; s/^/- /' > notes.md || true
          [ -s notes.md ] || echo "Maintenance release." > notes.md
          cat notes.md
          GH_TOKEN="$RELEASES_TOKEN" gh release create "$GITHUB_REF_NAME" \
            --repo "$RELEASES_REPO" \
            --title "Vey Studio ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            installers/*
